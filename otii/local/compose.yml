# Otii Learn's database and Redis on a laptop. Started and stopped by up.sh / down.sh.
name: otii-learn-local

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: learnhouse
      POSTGRES_PASSWORD: learnhouse
      POSTGRES_DB: learnhouse
    ports:
      - "127.0.0.1:${LEARN_PG_PORT}:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U learnhouse"]
      interval: 2s
      retries: 30

  redis:
    image: redis:7.2.3-alpine
    ports:
      - "127.0.0.1:${LEARN_REDIS_PORT}:6379"
    mem_limit: 64m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 30

volumes:
  postgres:
